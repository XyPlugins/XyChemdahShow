plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.xy'
version = '1.4.2'

repositories {
    mavenCentral()
    maven { url 'https://repo.tabooproject.org/repository/releases/' }   // Chemdah API
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' } // Spigot API
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/public/' } // Spigot transitive dependencies
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' } // BungeeCord chat snapshots for Spigot 1.12
}

dependencies {
    // Spigot API（由服务器提供，编译时需要）
    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'

    // 所有前置插件（DragonCore, Chemdah, PlaceholderAPI）从本地 libs 文件夹加载
    // 你需要将这三个插件的 .jar 文件放入项目根目录下的 libs/ 文件夹
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    // Chemdah API（如果本地 libs 中已有完整插件，也可不单独引，但为保险保留远程）
    // 注意：如果 libs 里已有 Chemdah-xxx.jar，下面这行可以注释掉，避免冲突
    compileOnly 'ink.ptms.chemdah:api:1.1.15'
}

processResources {
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}

shadowJar {
    archiveClassifier.set('')
}

build.dependsOn shadowJar
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}