# 总开关：是否开启任务导航。
# 关闭后玩家执行 /xychshow nav 会提示导航未启用。
navigation-enabled: true

messages:
  # 独立运行时使用本前缀；检测到 XyCore 时，玩家聊天提示优先使用 XyCore config.yml -> messages.prefix。
  prefix: '&7[&bXyChemdahShow&7]&r '

# HUD 普通刷新延迟，20 tick = 1 秒。
huddelay: 30

# HUD 保活刷新。
# 用于处理 DragonCore 任务栏待久后文本/视图被客户端清掉，手动刷新后又恢复的问题。
hud-keep-alive:
  # 是否开启保活。开启后插件会定期轻量刷新任务文本、标题变量和导航按钮显示状态。
  enabled: true
  # 保活刷新间隔，20 tick = 1 秒。建议 100-200，太低会增加 DragonCore 发包频率。
  interval: 100
  # 是否每次保活都重新打开 HUD。
  # 默认 false：只刷新组件文本和按钮状态，性能更稳，也不会强制展开玩家收起的任务栏。
  # 如果实测 DragonCore 会把整个 HUD 关闭，导致轻量刷新无效，再改为 true。
  reopen-hud: false

# 任务进度推进刷新延迟。击杀、挖掘等实时进度建议保持较低。
progress-refresh-delay: 3

# 玩家进服后首次显示任务 HUD 的延迟。
joindelay: 60

# 玩家没有可显示任务时，是否自动关闭 HUD。
deletehud: false

# deletehud 为 false 且玩家没有任务时显示的文字。
empty-text: '§7暂无正在进行的任务'

# 是否在子任务后显示 Chemdah 计数进度，例如 1/10。
task-progress-enabled: true

# 子任务未完成时的进度显示格式。
# 可用变量：%current% 当前进度，%target% 目标进度，%percent% 百分比。
task-progress-format: ' §8[§a%current%§7/§e%target%§8]'

# 子任务已完成时的进度显示格式。
task-completed-progress-format: ' §8[§a%current%§7/§a%target%§8]'
# 结构化任务视图每行的显示格式。
# 可用变量：%label% 标签名，%value% 内容值。
# 例如想显示 类型=击杀委托，可以改为 '&7%label%=&f%value%'。
structured-line-format: '&7%label%: &f%value%'

# 结构化任务视图标签名称。这里控制“类型、地点、目标、详情”这些前缀文字。
structured-labels:
  type: '类型'
  location: '地点'
  target: '目标'
  detail: '详情'

# 任务导航功能。任务中配置 addon.xychshow.nav 或 addon.track 坐标后，玩家可通过 /xychshow nav 开始或停止导航。
# DragonCore 平面箭头贴图的视觉配置位于 questhud.yml 的 任务导航按钮.navigation 下。
navigation:
  # 导航粒子刷新频率，20 tick = 1 秒。
  # 数值越小刷新越快，视觉更连贯，但消耗也会更高。
  particle-interval: 8
  # 距离目标多少格内自动停止导航。
  arrive-distance: 3.0
  # 粒子的密集程度。数值越小粒子越密，数值越大粒子越稀。
  particle-spacing: 0.9
  # 箭头头部长度。
  arrow-head-length: 1.4
  # 单次刷新最多生成多少个路线粒子点。数值越大线路越长，但粒子数量也越多。
  max-points: 80
  # 是否让路线粒子跟随地面高度。
  # 开启后粒子会在每个路线点附近寻找可站立表面，减少悬崖、坡道处悬空的问题。
  ground-follow-enabled: true
  # 贴地搜索时，允许从上一粒子高度向上找多少格。
  # 地形上坡明显时可适当调大，室内屋顶较低时不建议过大。
  ground-search-up: 4
  # 贴地搜索时，允许从上一粒子高度向下找多少格。
  # 悬崖较深时可调大，但数值越大每次刷新检查的方块越多。
  ground-search-down: 48
  # 粒子离地高度。
  ground-offset: 0.15
  # 导航路线粒子效果。
  # 可直接写 Bukkit 1.12.2 粒子名，例如 VILLAGER_HAPPY、END_ROD、SPELL_WITCH、CRIT_MAGIC、FLAME、TOTEM。
  # 也可写预设名：绿色箭头、白色光点、魔法紫、蓝紫闪光、火焰、经验球风格。
  # 注意：经验球风格是粒子模拟，不会生成经验球实体。
  particle: 绿色箭头
